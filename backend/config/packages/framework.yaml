framework:
    secret: '%env(APP_SECRET)%'
    default_locale: nl
    enabled_locales: ['nl', 'en', 'ar']
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: ['nl']
    session:
        handler_id: '%env(REDIS_URL)%'
        cookie_secure: auto
        cookie_samesite: lax
    cache:
        app: cache.adapter.redis
        default_redis_provider: '%env(REDIS_URL)%'
    php_errors:
        log: true
