security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout
                target: app_home_redirect
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: '^/(nl|en|ar)/listings/new', roles: ROLE_USER }
        - { path: '^/(nl|en|ar)/my-listings', roles: ROLE_USER }
