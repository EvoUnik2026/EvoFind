services:
  traefik:
    image: traefik:v3.1
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php]
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`${DOMAIN:-evofind.localhost}`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=80

  php:
    build: ./docker/php
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change-me}
      DATABASE_URL: mysql://${MYSQL_USER:-evofind}:${MYSQL_PASSWORD:-change-me}@mariadb:3306/${MYSQL_DATABASE:-evofind}?serverVersion=mariadb-11.4.0&charset=utf8mb4
      REDIS_URL: redis://redis:6379
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-evofind}
      MARIADB_USER: ${MYSQL_USER:-evofind}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: mariadb
    depends_on: [mariadb]
    labels:
      - traefik.enable=true
      - traefik.http.routers.adminer.rule=Host(`adminer.${DOMAIN:-evofind.localhost}`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080

volumes:
  db_data:
  redis_data:
